<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Практика · Логика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Lora:wght@600&display=swap" rel="stylesheet">
<style>
/* Спокойная «тетрадная» страница: бумага, чернила, бордовый акцент. Сначала телефон. */
:root{
  --paper:#F6F3EE; --card:#FFFFFF; --ink:#1E1B18; --dim:#6B645C; --rule:#E4DED5;
  --acc:#8A2433; --acc-soft:#F4E6E8; --ok:#1E7A4C; --ok-soft:#E3F2EA; --bad:#B4372F; --bad-soft:#FBE9E7;
  --f:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --fh:"Lora",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#16130F; --card:#1F1B17; --ink:#EDE7DF; --dim:#A59C91; --rule:#38312A;
  --acc:#E07A88; --acc-soft:#3A2227; --ok:#5CC48E; --ok-soft:#1C3328; --bad:#F08A80; --bad-soft:#3A2220; color-scheme:dark;}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--f);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
.kicker{margin:0 0 4px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
h1{font:600 clamp(34px,9vw,52px)/1.05 var(--fh);margin:0 0 12px;letter-spacing:-.01em}
h1.ttl{font-size:clamp(26px,7vw,36px);margin-bottom:20px}
.hero{max-width:720px;margin:0 auto;padding:40px 16px 8px}
.lead{margin:0 0 20px;color:var(--dim);max-width:52ch}
.meter{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--dim)}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .3s}
h2.src{font:600 13px/1.4 var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:32px 0 10px}
.list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.list li+li{border-top:1px solid var(--rule)}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;text-decoration:none;min-height:56px}
.row:hover{background:var(--acc-soft)}
.num{font:600 14px/1 var(--f);color:var(--dim);font-variant-numeric:tabular-nums;width:22px}
.rt{flex:1;font-weight:500}
.rt small{display:block;font-weight:400;font-size:13px;color:var(--dim);margin-top:2px}
.mark{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--dim)}
.row.ok .mark{color:var(--ok)} .row.part .mark{color:var(--bad)}
.row.ok .num,.row.part .num{color:var(--acc)}
.foot{margin-top:28px;font-size:13px;color:var(--dim)}
.lnk{text-decoration:underline;text-underline-offset:2px;color:var(--acc)}

.bar-top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;max-width:720px;margin:0 auto;
  padding:12px 16px;background:color-mix(in srgb,var(--paper) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:14px;color:var(--dim)}
.back{text-decoration:none;color:var(--acc);font-weight:600}
.wrap>.kicker{margin-top:12px}
.step{display:flex;gap:14px;margin:0 0 28px}
.sn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;margin-top:2px}
.step.locked .sn{background:var(--rule);color:var(--dim)}
.sb{flex:1;min-width:0}
.sb h2{font:600 18px/1.3 var(--f);margin:2px 0 12px}
video{display:block;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px}
.q{border:0;margin:0 0 20px;padding:0}
.q legend{font-weight:600;margin-bottom:10px;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin-bottom:8px;background:var(--card);border:1.5px solid var(--rule);border-radius:10px;cursor:pointer;line-height:1.4}
.opt input{margin:3px 0 0;accent-color:var(--acc);flex:none;width:18px;height:18px}
.opt:has(input:checked){border-color:var(--acc);background:var(--acc-soft)}
.opt.right,.opt.right:has(input:checked){border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong,.opt.wrong:has(input:checked){border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.opt.right,.opt.wrong,.opt.dim{cursor:default}
.expl{margin:4px 0 0;padding:12px 14px;border-left:3px solid var(--acc);background:var(--card);border-radius:0 10px 10px 0;font-size:15px}
.res{margin:0;font-size:15px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:0 0 6px}
.hint{color:var(--dim);margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:10px;background:var(--acc);color:#fff;font-weight:600;text-decoration:none}
.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:8px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (max-width:420px){.step{gap:10px}.sn{width:24px;height:24px;font-size:13px}}
.rule{margin:-8px 0 18px;font-size:14px;color:var(--acc);font-weight:500}
.chip{display:inline-block;align-self:flex-start;font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--rule);color:var(--dim);white-space:nowrap}
.chip.warn{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.bar-top{gap:10px}
.row.locked{opacity:.45;cursor:not-allowed}
.row.locked .mark{font-weight:500}
.sn.done{background:var(--ok)}
.btn.off{background:var(--rule);color:var(--dim);cursor:not-allowed}
#toast{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0 auto;width:max-content;max-width:90vw;
  background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:10px;font-size:14px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.25);
  opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:20}
#toast.show{opacity:1;transform:none}

</style>
</head>

    x:"Всё до «веток реальности» верно: неоднозначный звук слышат по-разному. Но «почему именно ветки реальности?» — на это аргументов нет вообще."}
  ]},
 {src:1, title:"«Дом твоей души»", kind:"Недоказанное основание",
  qs:[
   {q:"На чём держится рассказ о пропорциях миров и «доме души»?",
    o:["На «ведической концепции», принятой как данность","На астрономических наблюдениях","На опросе слушателей","На научных статьях"], a:0},
   {q:"Где здесь изъян?",
    o:["Цепочка внутри логична, но её основание не доказано — его подают как само собой разумеющееся","Ложная аналогия","Довод к личности","Вывод противоречит посылкам"], a:0,
    x:"Это предвосхищение основания: все выводы опираются на посылку, которую никто не доказывал. Обсуждать начинают детали, и спорная основа незаметно становится «очевидной»."}
  ]},
 {src:1, title:"Переход из 3D в 5D", kind:"Непроверяемое утверждение",
  qs:[
   {q:"Что обещают зрителю?",
    o:["Переход в мир «высоких вибраций» и блаженства уже в этой жизни","Посмертное воздаяние","Конкретное событие в назначенный день","Выигрыш в лотерею"], a:0},
   {q:"Почему такое утверждение нельзя опровергнуть и чем это плохо?",
    o:["При любом исходе найдётся объяснение, поэтому утверждение ничего не утверждает","Его нельзя опровергнуть, потому что оно истинно","Оно опирается на науку","Его подтверждают свидетели"], a:0,
    x:"«Мир не стал лучше? Значит, другие перешли в 5D, а ты завис» — на любой результат готов ответ. То, что нельзя проверить ни при каком исходе, не может считаться доказанным."}
  ]},
 {src:1, title:"День без гравитации", kind:"Ссылка на слухи и довод к страху",
  qs:[
   {q:"На что ссылается автор ролика?",
    o:["«По некоторым данным» и на слухи о «засекреченном документе НАСА»","На официальное заявление НАСА","На расчёты физиков","На прошлый подобный случай"], a:0},
   {q:"Какая здесь ошибка?",
    o:["Неназванный и непроверяемый источник плюс давление на страх: «фейк, но предупреждён — значит вооружён»","Подмена тезиса","Приведение к абсурду","Ошибки нет, это шутка"], a:0,
    x:"Автор ролика сама признаёт, что это фейк, и всё равно советует запастись карабинами. Аргумент заменён тревогой."}
  ]}
];

/* Практика · Логика. Фрагменты открываются по порядку:
   фрагмент досмотрен → вопросы → проверка → разбор досмотрен → следующий.
   Уход со страницы считается; каждые 3 выхода — минус балл. Всё хранится в этом браузере. */
var KEY = "praktika_logika_v2";
var ST = { ans: {}, wa: {}, wb: {}, leaves: 0 };
try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); if (o && o.ans) ST = o; } } catch (e) {}
ST.wa = ST.wa || {}; ST.wb = ST.wb || {}; ST.leaves = ST.leaves || 0;
function save() { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} }

var PER = 3;      // сколько выходов — один штрафной балл

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]; }); }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function plural(n, a, b, c) { var m = n % 10, h = n % 100; return (m === 1 && h !== 11) ? a : (m >= 2 && m <= 4 && (h < 12 || h > 14)) ? b : c; }

/* Порядок вариантов перемешан, но одинаково при каждой загрузке. */
function order(n, qi, len) {
  var x = (n + 1) * 2654435761 ^ (qi + 1) * 40503;
  function rnd() { x |= 0; x = x + 0x6D2B79F5 | 0; var t = Math.imul(x ^ x >>> 15, 1 | x); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
  var a = []; for (var i = 0; i < len; i++) a.push(i);
  for (var j = len - 1; j > 0; j--) { var k = Math.floor(rnd() * (j + 1)); var t2 = a[j]; a[j] = a[k]; a[k] = t2; }
  return a;
}
function answered(n) { return !!ST.ans[n]; }
function complete(n) { return answered(n) && !!ST.wb[n]; }
function unlocked(n) { return n === 0 || complete(n - 1); }
function firstOpen() { for (var n = 0; n < ITEMS.length; n++) if (!complete(n)) return n; return ITEMS.length - 1; }
function score(n) { var a = ST.ans[n]; if (!a) return 0; return ITEMS[n].qs.reduce(function (s, q, i) { return s + (a[i] === q.a ? 1 : 0); }, 0); }
function penalty() { return Math.floor(ST.leaves / PER); }
function total() {
  var s = 0, m = 0; ITEMS.forEach(function (it, n) { m += it.qs.length; s += score(n); });
  return { right: s, max: m, pen: penalty(), pts: Math.max(0, s - penalty()) };
}

function leavesChip() {
  var p = penalty(), left = PER - ST.leaves % PER;
  return '<span class="chip' + (ST.leaves ? ' warn' : '') + '" title="Каждые ' + PER + ' выхода со страницы — минус балл">Выходов: ' + ST.leaves +
    (p ? ' · штраф −' + p : '') + '</span>';
}

/* ---------- список ---------- */
function home() {
  var t = total(), cnt = ITEMS.filter(function (_, n) { return complete(n); }).length;
  var h = '<header class="hero"><p class="kicker">Практика</p><h1>Логика</h1>' +
    '<p class="lead">Посмотрите фрагмент ролика, ответьте на вопросы, затем посмотрите разбор. Фрагменты открываются по порядку. Ищите, где рассуждение ломается: тезис, аргументы или связь между ними.</p>' +
    '<p class="rule">Не уходите со страницы: каждый выход фиксируется, каждые ' + PER + ' выхода — минус балл.</p>' +
    '<div class="meter"><div class="bar"><i style="width:' + Math.round(cnt / ITEMS.length * 100) + '%"></i></div>' +
    '<span>Пройдено ' + cnt + ' из ' + ITEMS.length + ' · баллы ' + t.pts + ' из ' + t.max +
    (t.pen ? ' (верных ' + t.right + ', штраф −' + t.pen + ')' : '') + '</span>' + leavesChip() + '</div></header><main class="wrap">';
  SOURCES.forEach(function (src, si) {
    h += '<h2 class="src">' + esc(src) + '</h2><ol class="list">';
    ITEMS.forEach(function (it, n) {
      if (it.src !== si) return;
      var open = unlocked(n), st = answered(n) ? (score(n) === it.qs.length ? "ok" : "part") : "";
      var inner = '<span class="num">' + pad(n + 1) + '</span><span class="rt">' + esc(it.title) +
        (answered(n) ? '<small>' + esc(it.kind) + '</small>' : '') + '</span>' +
        '<span class="mark">' + (answered(n) ? score(n) + '/' + it.qs.length : (open ? '' : 'закрыто')) + '</span>';
      h += '<li>' + (open ? '<a class="row ' + st + '" href="#/' + (n + 1) + '">' + inner + '</a>' : '<span class="row locked">' + inner + '</span>') + '</li>';
    });
    h += '</ol>';
  });
  h += '<p class="foot">Фрагменты — из роликов канала «Когнитивный надзор». Ответы сохраняются только в этом браузере.</p></main>';
  return h;
}

/* ---------- фрагмент ---------- */
function item(n) {
  var it = ITEMS[n], a = ST.ans[n], checked = !!a, sawA = !!ST.wa[n], sawB = !!ST.wb[n];
  var h = '<nav class="bar-top"><a href="#/" class="back">← Все фрагменты</a>' + leavesChip() + '<span>' + pad(n + 1) + ' / ' + ITEMS.length + '</span></nav><main class="wrap">';
  h += '<p class="kicker">' + esc(SOURCES[it.src].replace(/\..*/, "")) + ' · фрагмент ' + pad(n + 1) + '</p><h1 class="ttl">' + esc(it.title) + '</h1>';

  h += '<section class="step"><div class="sn' + (sawA ? ' done' : '') + '">1</div><div class="sb"><h2>Смотрите фрагмент</h2>' +
    '<video src="video/' + pad(n + 1) + 'a.mp4" controls playsinline preload="metadata" data-w="a" controlslist="nodownload noplaybackrate" disablepictureinpicture></video>' +
    (sawA ? '' : '<p class="hint">Досмотрите фрагмент до конца — перематывать вперёд нельзя.</p>') + '</div></section>';

  h += '<section class="step' + (sawA ? '' : ' locked') + '"><div class="sn' + (checked ? ' done' : '') + '">2</div><div class="sb"><h2>Ответьте на вопросы</h2>';
  if (!sawA) h += '<p class="hint">Вопросы откроются, когда фрагмент будет досмотрен.</p>';
  else {
    it.qs.forEach(function (q, qi) {
      h += '<fieldset class="q"><legend>' + esc(q.q) + '</legend>';
      order(n, qi, q.o.length).forEach(function (oi) {
        var cls = "opt";
        if (checked) { if (oi === q.a) cls += " right"; else if (a[qi] === oi) cls += " wrong"; else cls += " dim"; }
        h += '<label class="' + cls + '"><input type="radio" name="q' + qi + '" value="' + oi + '"' + (checked ? ' disabled' : '') +
          (checked && a[qi] === oi ? ' checked' : '') + '><span>' + esc(q.o[oi]) + '</span></label>';
      });
      if (checked && q.x) h += '<p class="expl">' + esc(q.x) + '</p>';
      h += '</fieldset>';
    });
    if (!checked) h += '<p class="err" id="err"></p><button class="btn" data-a="check">Проверить</button>';
    else h += '<p class="res">' + (score(n) === it.qs.length ? 'Всё верно.' : 'Верно ' + score(n) + ' из ' + it.qs.length + '.') +
      ' Ошибка в ролике: <b>' + esc(it.kind) + '</b>.</p>';
  }
  h += '</div></section>';

  h += '<section class="step' + (checked ? '' : ' locked') + '"><div class="sn' + (sawB ? ' done' : '') + '">3</div><div class="sb"><h2>Разбор</h2>' +
    (checked ? '<video src="video/' + pad(n + 1) + 'b.mp4" controls playsinline preload="metadata" data-w="b" controlslist="nodownload noplaybackrate" disablepictureinpicture></video>' +
      (sawB ? '' : '<p class="hint">Досмотрите разбор, чтобы перейти дальше.</p>')
      : '<p class="hint">Откроется после проверки ответов.</p>') + '</div></section>';

  var next = complete(n);
  h += '<nav class="pager">' + (n > 0 ? '<a class="btn ghost" href="#/' + n + '">← Назад</a>' : '<span></span>') +
    (n < ITEMS.length - 1
      ? (next ? '<a class="btn" href="#/' + (n + 2) + '">Дальше →</a>' : '<span class="btn off" aria-disabled="true">Дальше →</span>')
      : (next ? '<a class="btn" href="#/">Итог</a>' : '<span class="btn off" aria-disabled="true">Итог</span>')) + '</nav></main>';
  return h;
}

/* Видео: перемотка вперёд дальше просмотренного запрещена, «досмотрено» — по событию ended. */
function guardVideo(v, n) {
  var w = v.getAttribute("data-w"), max = 0;
  var seen = w === "a" ? ST.wa[n] : ST.wb[n];
  v.addEventListener("timeupdate", function () { if (!v.seeking && v.currentTime > max && v.currentTime - max < 2) max = v.currentTime; });
  v.addEventListener("seeking", function () { if (!seen && v.currentTime > max + 1) v.currentTime = max; });
  v.addEventListener("ratechange", function () { if (v.playbackRate !== 1) v.playbackRate = 1; });
  v.addEventListener("ended", function () {
    if (seen) return;
    seen = true;
    if (w === "a") ST.wa[n] = 1; else ST.wb[n] = 1;
    save();
    var y = window.scrollY; route(true); window.scrollTo(0, y);
  });
}

function route(keep) {
  var m = location.hash.match(/^#\/(\d+)/), n = m ? +m[1] - 1 : -1;
  if (n >= ITEMS.length) n = -1;
  if (n >= 0 && !unlocked(n)) { location.replace("#/" + (firstOpen() + 1)); return; }
  document.querySelectorAll("video").forEach(function (v) { try { v.pause(); } catch (e) {} });
  $("app").innerHTML = n >= 0 ? item(n) : home();
  document.title = n >= 0 ? pad(n + 1) + ". " + ITEMS[n].title + " — Практика · Логика" : "Практика · Логика";
  if (!keep) window.scrollTo(0, 0);
  document.querySelectorAll("video[data-w]").forEach(function (v) { guardVideo(v, n); });
}

/* ---------- уход со страницы ---------- */
var away = false;
function leave() { if (away) return; away = true; ST.leaves++; ST.lastLeave = Date.now(); save(); }
/* Перезагрузка страницы выходом не считается. */
(function () {
  try {
    var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
    if (nav && nav.type === "reload" && ST.lastLeave && Date.now() - ST.lastLeave < 8000 && ST.leaves > 0) { ST.leaves--; ST.lastLeave = 0; save(); }
  } catch (e) {}
})();
function back() {
  if (!away) return; away = false;
  var chips = document.querySelectorAll(".chip"); chips.forEach(function (c) { c.outerHTML = leavesChip(); });
  var left = PER - ST.leaves % PER;
  toast('Вы покидали страницу. Выходов: ' + ST.leaves + '. ' +
    (ST.leaves % PER === 0 ? 'Снят балл.' : 'До штрафа: ' + left + ' ' + plural(left, 'выход', 'выхода', 'выходов') + '.'));
}
document.addEventListener("visibilitychange", function () { if (document.hidden) leave(); else back(); });
window.addEventListener("pagehide", leave);
window.addEventListener("pageshow", function () { if (away) back(); });

var toastT = null;
function toast(msg) {
  var t = $("toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
  t.textContent = msg; t.className = "show"; clearTimeout(toastT); toastT = setTimeout(function () { t.className = ""; }, 4500);
}

document.addEventListener("click", function (e) {
  var b = e.target.closest ? e.target.closest("[data-a]") : null; if (!b) return;
  if (b.getAttribute("data-a") === "check") {
    var m = location.hash.match(/^#\/(\d+)/), n = +m[1] - 1, it = ITEMS[n], res = [];
    for (var qi = 0; qi < it.qs.length; qi++) {
      var c = document.querySelector('input[name="q' + qi + '"]:checked');
      if (!c) { $("err").textContent = "Ответьте на все вопросы."; return; }
      res.push(+c.value);
    }
    ST.ans[n] = res; save();
    var y = window.scrollY; route(true); window.scrollTo(0, y);
  }
});
window.addEventListener("hashchange", function () { route(); });
route();

</script>
